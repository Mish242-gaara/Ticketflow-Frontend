<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TicketFlow — Hors ligne</title>
  
  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050C18; 
      color: #FFFFFF;
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100dvh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 1.5rem;
    }
    .container { text-align: center; max-width: 340px; }
    .icon { font-size: 64px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: 2px; }
    p { color: rgba(255,255,255,0.7); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
    
    .badge { 
      display: inline-block; 
      background: #E50914; 
      color: #fff; 
      padding: 4px 12px; 
      border-radius: 999px; 
      font-size: 11px; 
      font-weight: 700; 
      letter-spacing: 2px; 
      margin-bottom: 1.5rem; 
    }
    
    button {
      background: #E50914; 
      color: #fff; 
      border: none; 
      padding: 16px 32px;
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer;
      transition: all 0.3s ease; 
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button:hover { background: #B81D1D; transform: scale(1.02); }
    
    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 2rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .dot.active { background: #E50914; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎟️</div>
    <div class="badge">HORS LIGNE</div>
    <h1>PAS DE CONNEXION</h1>
    <p>Vérifiez votre connexion internet et réessayez. Vos tickets déjà téléchargés restent accessibles.</p>
    
    <button onclick="window.location.reload()">
      🔄 Réessayer la connexion
    </button>
    
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Redirection automatique dès que la connexion est rétablie
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
