<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TicketFlow — Hors ligne</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050C18; color: #F0F4FF;
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .container { text-align: center; max-width: 340px; }
    .icon { font-size: 64px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; letter-spacing: 1px; }
    p { color: rgba(240,244,255,0.5); font-size: 0.9rem; line-height: 1.6; margin-bottom: 2rem; }
    .badge { display: inline-block; background: #C0392B; color: #fff; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 2px; margin-bottom: 1.5rem; }
    button {
      background: #C0392B; color: #fff; border: none; padding: 14px 32px;
      border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer;
      transition: background 0.2s; width: 100%;
    }
    button:hover { background: #A93226; }
    .dots { display: flex; justify-content: center; gap: 6px; margin-top: 1.5rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .dot.active { background: #3B82F6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎟️</div>
    <div class="badge">HORS LIGNE</div>
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre connexion internet et réessayez. Vos tickets déjà téléchargés restent accessibles.</p>
    <button onclick="window.location.reload()">🔄 Réessayer</button>
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script>
    window.addEventListener('online', () => window.location.href = '/');
  </script>
</body>
</html>
