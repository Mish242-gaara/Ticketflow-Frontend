<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0D1B2E"/>
  <rect x="0" y="0" width="16" height="512" rx="8" fill="#C0392B"/>
  <!-- Ticket shape -->
  <rect x="80" y="160" width="352" height="192" rx="20" fill="#1C3050"/>
  <!-- Perforations -->
  <circle cx="80" cy="256" r="24" fill="#0D1B2E"/>
  <circle cx="432" cy="256" r="24" fill="#0D1B2E"/>
