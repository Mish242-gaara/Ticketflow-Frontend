<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TicketFlow" />
    <meta name="application-name" content="TicketFlow" />

    <!-- Theme color (mis à jour dynamiquement par le themeStore) -->
    <meta name="theme-color" content="#050C18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F0F4FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050C18" />

    <!-- SEO -->
    <title>TicketFlow — Réservation de tickets en ligne</title>
    <meta name="description" content="Réservez vos tickets pour les événements ESTAM BDE — Pointe-Noire, Congo. Paiement Mobile Money, QR code sécurisé." />
    <meta name="keywords" content="tickets, événements, ESTAM, BDE, Pointe-Noire, Congo, Mobile Money" />
    <meta name="author" content="ESTAM BDE" />

    <!-- Open Graph -->
    <meta property="og:title" content="TicketFlow — ESTAM BDE" />
    <meta property="og:description" content="Réservez vos tickets en ligne — Pointe-Noire, Congo" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.svg" />

    <!-- Apple icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Prevent FOUC: appliquer le thème avant le rendu -->
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('ticketflow-theme') || '{}');
          var theme = stored.state?.theme || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
